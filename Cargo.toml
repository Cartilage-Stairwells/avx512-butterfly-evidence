[package]
name = "avx512_butterfly"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
serde_json = "1"
p3-baby-bear = "0.1"
p3-field = "0.1"
rand = "0.8"

[dev-dependencies]
proptest = "1"
criterion = "0.8.2"
# §14 Large Tier external oracle (Plonky3, separate codebase —
# never derived from this repository's implementations; tier-independence
# rule, spec §14). Version pinned by Cargo.lock (0.1.0).
p3-dft = "0.1"

[[bench]]
name = "butterfly_bench"
harness = false

[[bench]]
name = "ntt_bench"
harness = false

[[bench]]
name = "three_lane_bench"
harness = false

[[bench]]
name = "neon_butterfly_bench"
harness = false

[features]
default = ["std"]
std = []

[[test]]
name = "babybear_montgomery"
path = "tests/babybear_montgomery.rs"

[[test]]
name = "legacy_montgomery_regression"
path = "tests/archive/legacy_montgomery_regression.rs"

[[test]]
name = "babybear_domain"
path = "tests/babybear_domain.rs"

[[test]]
name = "ntt_equivalence"
path = "tests/ntt_equivalence.rs"

[[test]]
name = "representation_audit"
path = "tests/representation_audit.rs"

[[test]]
name = "raw_u32_audit"
path = "tests/raw_u32_audit.rs"

[[bin]]
name = "iep_runner"
path = "instrument/runner/main.rs"

[[test]]
name = "iep_enforcement"
path = "tests/iep_enforcement.rs"

[[test]]
name = "avx512_intrinsic_semantics"

[[test]]
name = "neon_intrinsic_semantics"
path = "tests/neon_intrinsic_semantics.rs"

[[test]]
name = "core_domain_blindness"
path = "tests/core_domain_blindness.rs"
